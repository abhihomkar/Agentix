name: GeneratePDF
script: |-
  register_module_line('GeneratePDF', 'start', __line__())

  """
  GeneratePDF
  ===========

  Turns Markdown or HTML into a styled PDF and returns it as a war room file.

  Rendering is done by headless Chrome (the ``demisto/chromium`` image) through
  the DevTools ``Page.printToPDF`` call, so the full modern CSS box model, web
  fonts, background colours and repeating page headers / footers all work - the
  things LibreOffice (``demisto/office-utils``, ``ConvertFile``) cannot do well.

  Flow: read content -> Markdown to HTML (bundled converter) -> heading ids and
  optional table of contents -> wrap in the theme or a custom template -> build
  the running header / footer (with the logo embedded as a data URI) -> print
  with Chrome -> count pages -> return the file entry and a context summary.

  Input
  -----
  ``Content``      Markdown or HTML text.
  ``EntryID``      A war room file holding the Markdown or HTML (instead of Content).
  ``InputFormat``  ``auto`` (default), ``markdown`` or ``html``. ``auto`` picks HTML
                   for ``.htm``/``.html`` files and for text that starts with a tag.

  Look
  ----
  ``Title``            Title block on page 1 and ``{{title}}`` in templates.
  ``Theme``            ``clean`` (default), ``corporate``, ``dark-code``, ``minimal``
                       or ``none`` (no built-in CSS at all).
  ``CustomCSS``        Extra CSS added after the theme.
  ``IncludeTOC``       Insert a table of contents built from h1-h3.
  ``TemplateListName`` A list holding a page template with a ``{{content}}``
                       placeholder. ``{{title}}``, ``{{date}}`` and ``{{logo}}``
                       are filled in as well.

  Page
  ----
  ``PageSize`` (``A4``, ``Letter``, ``Legal``), ``Orientation`` (``portrait``,
  ``landscape``), ``HeaderText``, ``FooterText``, ``ShowPageNumbers``,
  ``LogoEntryID`` / ``LogoListName`` (PNG, JPEG, GIF or SVG; a list holds it as
  base64 or a data URI), ``LogoPosition`` (``left``, ``right``, ``none``),
  ``LogoHeight`` (pixels), and ``HeaderTemplate`` / ``FooterTemplate`` - custom
  HTML replacing the default header / footer, with the same placeholders plus
  Chrome's ``pageNumber`` and ``totalPages`` classes.

  Output
  ------
  The PDF file entry (the engine adds it to ``File``), plus ``GeneratePDF.FileName``,
  ``GeneratePDF.Title``, ``GeneratePDF.Pages`` and ``GeneratePDF.SizeBytes``.
  """

  import base64
  import html as html_lib
  import io
  import json
  import os
  import re
  import shutil
  import subprocess
  import tempfile
  import time
  import traceback
  import urllib.request
  from datetime import datetime, timezone
  from pathlib import Path
  from typing import Any, Dict, List, Optional, Tuple

  SCRIPT_NAME = "GeneratePDF"

  # Paper sizes in inches (width, height), portrait.
  PAGE_SIZES: Dict[str, Tuple[float, float]] = {
      "A4": (8.27, 11.69),
      "Letter": (8.5, 11.0),
      "Legal": (8.5, 14.0),
  }

  # Page margins in inches. The top and bottom grow when a running header or
  # footer is printed, since Chrome draws those inside the margin.
  SIDE_MARGIN = 0.6
  PLAIN_MARGIN = 0.6
  HEADER_MARGIN = 0.95
  FOOTER_MARGIN = 0.75

  # Where the Chrome binary lives. demisto/chromium installs Google Chrome at the
  # first path and sets CHROME_EXE, as its rasterize integration expects.
  CHROME_CANDIDATES = (
      "/opt/google/chrome/google-chrome",
      "google-chrome",
      "google-chrome-stable",
      "chromium",
      "chromium-browser",
  )

  IMAGE_SIGNATURES: Tuple[Tuple[bytes, str], ...] = (
      (b"\x89PNG\r\n\x1a\n", "image/png"),
      (b"\xff\xd8\xff", "image/jpeg"),
      (b"GIF87a", "image/gif"),
      (b"GIF89a", "image/gif"),
  )

  THEMES = ("clean", "corporate", "dark-code", "minimal", "none")
  INPUT_FORMATS = ("auto", "markdown", "html")
  ORIENTATIONS = ("portrait", "landscape")
  LOGO_POSITIONS = ("left", "right", "none")

  HEADER_FONT = "'Noto Sans', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif"

  BASE_CSS = """
  :root {
    --text: #1f2328; --muted: #59636e; --accent: #0969da; --heading: #1f2328;
    --border: #d1d9e0; --code-bg: #f6f8fa; --code-text: #1f2328;
    --th-bg: #f6f8fa; --th-text: #1f2328; --stripe: #fafbfc; --quote: #d1d9e0;
    --font-body: 'Noto Sans', 'Liberation Sans', 'Helvetica Neue', Arial, sans-serif;
    --font-head: var(--font-body);
    --font-mono: 'Noto Sans Mono', 'DejaVu Sans Mono', 'Liberation Mono', Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body {
    margin: 0; color: var(--text); font-family: var(--font-body);
    font-size: 10.5pt; line-height: 1.6; word-wrap: break-word;
  }
  h1, h2, h3, h4, h5, h6 {
    font-family: var(--font-head); color: var(--heading); line-height: 1.25;
    margin: 1.4em 0 0.5em; font-weight: 600; break-after: avoid; page-break-after: avoid;
  }
  h1 { font-size: 1.9em; padding-bottom: 0.25em; border-bottom: 1px solid var(--border); }
  h2 { font-size: 1.45em; padding-bottom: 0.2em; border-bottom: 1px solid var(--border); }
  h3 { font-size: 1.2em; }
  h4 { font-size: 1.05em; }
  h5, h6 { font-size: 0.95em; color: var(--muted); }
  p, ul, ol, dl, table, pre, blockquote { margin: 0 0 0.9em; }
  a { color: var(--accent); text-decoration: none; }
  strong { font-weight: 600; }
  ul, ol { padding-left: 1.6em; }
  li + li { margin-top: 0.2em; }
  li > ul, li > ol { margin: 0.2em 0 0; }
  li.task { list-style: none; margin-left: -1.3em; }
  .checkbox { display: inline-block; width: 0.9em; margin-right: 0.35em; color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--border); margin: 1.6em 0; }
